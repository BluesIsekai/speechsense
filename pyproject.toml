[project]
name = "speechsense"
version = "0.1.0"
description = "Speech Emotion Recognition Using Machine Learning"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "librosa",
    "matplotlib",
    "numpy",
    "pandas",
    "scikit-learn",
    "seaborn",
    "torch>=2.11.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
